name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  macos:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: SPM build
        run: swift build

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - swift:6.2
          - swift:6.3
          - swift:6.4
    services:
      localstack:
        image: localstack/localstack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    container:
      image: ${{ matrix.image }}
      env:
        AWS_ENDPOINT_URL: "http://localstack:4566"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Test
        run: swift test
